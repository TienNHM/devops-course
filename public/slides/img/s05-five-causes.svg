<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs>
<rect width="960" height="440" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">“Không vào được” là 1 trong 5 lỗi</text>
<rect x="30" y="170" width="250" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="155" y="229" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="700">Web em không</text>
<text x="155" y="261" font-size="20" text-anchor="middle" fill="#475569">vào được!</text>
<rect x="420" y="90" width="510" height="54" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="442" y="126" font-size="24" text-anchor="start" fill="#1d63ed" font-weight="700">1</text>
<text x="480" y="126" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700">DNS không ra IP</text>
<text x="912" y="125" font-size="19" text-anchor="end" fill="#475569" font-family="Consolas, 'Courier New', monospace">nslookup</text>
<path d="M284 235L416 117" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="156" width="510" height="54" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="442" y="192" font-size="24" text-anchor="start" fill="#1d63ed" font-weight="700">2</text>
<text x="480" y="192" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700">Không ai nghe port</text>
<text x="912" y="191" font-size="19" text-anchor="end" fill="#475569" font-family="Consolas, 'Courier New', monospace">curl (7)</text>
<path d="M284 235L416 183" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="222" width="510" height="54" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="442" y="258" font-size="24" text-anchor="start" fill="#1d63ed" font-weight="700">3</text>
<text x="480" y="258" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700">Bind sai địa chỉ</text>
<text x="912" y="257" font-size="19" text-anchor="end" fill="#475569" font-family="Consolas, 'Courier New', monospace">ss -ltnp</text>
<path d="M284 235L416 249" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="288" width="510" height="54" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="442" y="324" font-size="24" text-anchor="start" fill="#1d63ed" font-weight="700">4</text>
<text x="480" y="324" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700">Firewall chặn</text>
<text x="912" y="323" font-size="19" text-anchor="end" fill="#475569" font-family="Consolas, 'Courier New', monospace">curl (28)</text>
<path d="M284 235L416 315" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="354" width="510" height="54" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="442" y="390" font-size="24" text-anchor="start" fill="#1d63ed" font-weight="700">5</text>
<text x="480" y="390" font-size="22" text-anchor="start" fill="#0f172a" font-weight="700">App trả lỗi 5xx</text>
<text x="912" y="389" font-size="19" text-anchor="end" fill="#475569" font-family="Consolas, 'Courier New', monospace">curl -v</text>
<path d="M284 235L416 381" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/>

