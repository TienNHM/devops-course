<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="400" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">apt: cập nhật danh sách trước, rồi mới cài</text>
<rect x="40" y="110" width="200" height="110" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="140" y="159" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Kho Ubuntu</text>
<text x="140" y="191" font-size="20" text-anchor="middle" fill="#475569">đã ký số</text>
<path d="M242 165L378 165" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="310" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#1d63ed" font-family="Consolas, 'Courier New', monospace">update</text>
<rect x="380" y="110" width="200" height="110" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2.5"/>
<text x="480" y="159" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Danh sách gói</text>
<text x="480" y="191" font-size="20" text-anchor="middle" fill="#475569">bản sao trên máy</text>
<path d="M582 165L718 165" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="650" y="150" font-size="20" font-weight="700" text-anchor="middle" fill="#16a34a" font-family="Consolas, 'Courier New', monospace">install</text>
<rect x="720" y="110" width="200" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="820" y="159" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Phần mềm</text>
<text x="820" y="191" font-size="20" text-anchor="middle" fill="#475569">git, curl, ...</text>
<rect x="40" y="270" width="880" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="480" y="314" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Luôn đi cặp: update rồi install</text>
<text x="480" y="346" font-size="20" text-anchor="middle" fill="#475569">update chỉ làm mới danh sách; sudo = quyền root</text>

</svg>
