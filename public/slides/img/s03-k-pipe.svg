<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" width="960" height="285" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="285" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Pipe nối stdout với stdin</text>
<rect x="40" y="100" width="170" height="100" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="125" y="146" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">grep</text>
<text x="125" y="174" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">lọc dòng</text>
<path d="M212 150L388 150" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/>
<text x="300" y="128" font-size="40" font-weight="700" text-anchor="middle" fill="#d97706" font-family="Consolas, 'Courier New', monospace">|</text>
<text x="300" y="186" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">stdout → stdin</text>
<rect x="390" y="100" width="170" height="100" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="475" y="146" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">wc -l</text>
<text x="475" y="174" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">đếm dòng</text>
<path d="M562 150L738 150" stroke="#1d63ed" stroke-width="3" marker-end="url(#a)"/>
<text x="650" y="128" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">stdout</text>
<rect x="740" y="100" width="180" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="830" y="146" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Kết quả</text>
<text x="830" y="174" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">số dòng</text>
<text x="480" y="252" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">grep ... DB_PASSWORD | wc -l</text>

</svg>
