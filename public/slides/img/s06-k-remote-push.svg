<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 266" width="960" height="266" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="266" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Push gửi commit từ máy lên remote</text>
<rect x="40" y="80" width="250" height="110" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="165" y="131" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Máy của bạn</text>
<text x="165" y="161" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">repository local</text>
<rect x="670" y="80" width="250" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="795" y="131" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">GitHub</text>
<text x="795" y="161" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">remote: origin</text>
<path d="M294 115L666 115" stroke="#1d63ed" stroke-width="3" marker-end="url(#a)"/>
<text x="480" y="100" font-size="18" font-weight="400" text-anchor="middle" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">git push -u origin feature/add-club</text>
<path d="M666 165L294 165" stroke="#475569" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a)"/>
<text x="480" y="192" font-size="20" font-weight="400" text-anchor="middle" fill="#475569" font-family="Consolas, 'Courier New', monospace">git pull</text>
<text x="480" y="246" font-size="18" font-weight="400" text-anchor="middle" fill="#475569">push: máy lên GitHub; pull: GitHub về máy</text>

</svg>
