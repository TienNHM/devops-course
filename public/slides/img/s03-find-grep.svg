<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">find tìm file, grep tìm dòng</text>
<rect x="40" y="90" width="430" height="310" rx="14" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="255" y="128" font-size="24" font-weight="700" text-anchor="middle" fill="#1d63ed">find: tìm FILE</text>
<rect x="60" y="150" width="390" height="130" rx="12" fill="#0f172a"/>
<text x="75" y="190" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace"><tspan fill="#4ade80">$</tspan> find . -name "*.conf"</text>
<text x="75" y="228" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">./config/app.conf</text>
<text x="75" y="262" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">./config/db.conf</text>
<text x="255" y="320" font-size="20" text-anchor="middle" fill="#475569">theo tên, loại (-type), kích thước</text>
<text x="255" y="355" font-size="20" text-anchor="middle" fill="#475569">tên có khoảng trắng vẫn nguyên vẹn</text>
<rect x="490" y="90" width="430" height="310" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="705" y="128" font-size="24" font-weight="700" text-anchor="middle" fill="#16a34a">grep: tìm DÒNG</text>
<rect x="510" y="150" width="390" height="130" rx="12" fill="#0f172a"/>
<text x="525" y="190" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace"><tspan fill="#4ade80">$</tspan> grep -rn "port" config</text>
<text x="525" y="228" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">config/db.conf:2:port=5432</text>
<text x="705" y="320" font-size="20" text-anchor="middle" fill="#475569">theo nội dung bên trong file</text>
<text x="705" y="355" font-size="20" text-anchor="middle" fill="#475569" font-family="Consolas, 'Courier New', monospace">-i  -v  -c  -n  -r</text>

</svg>
