<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="440" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Private là chìa khóa, public là ổ khóa</text>
<rect x="40" y="90" width="400" height="210" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="240" y="135" font-size="26" font-weight="700" text-anchor="middle" fill="#dc2626">🔑 Private key</text>
<text x="240" y="175" font-size="20" text-anchor="middle" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">~/.ssh/id_ed25519</text>
<text x="240" y="220" font-size="22" text-anchor="middle" fill="#475569">ở lại máy bạn</text>
<text x="240" y="255" font-size="20" text-anchor="middle" fill="#475569">không chia sẻ, không commit</text>
<text x="480" y="205" font-size="40" text-anchor="middle" fill="#0f172a">🔗</text>
<rect x="520" y="90" width="400" height="210" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="720" y="135" font-size="26" font-weight="700" text-anchor="middle" fill="#16a34a">📢 Public key</text>
<text x="720" y="175" font-size="20" text-anchor="middle" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">~/.ssh/id_ed25519.pub</text>
<text x="720" y="220" font-size="22" text-anchor="middle" fill="#475569">dán lên GitHub</text>
<text x="720" y="255" font-size="20" text-anchor="middle" fill="#475569">chia sẻ được</text>
<rect x="40" y="330" width="880" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="480" y="369" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Chỉ copy file có đuôi .pub</text>
<text x="480" y="401" font-size="20" text-anchor="middle" fill="#475569">quyền key quá rộng thì SSH từ chối: chmod 600</text>

</svg>
