<text x="125" y="117" font-size="24" text-anchor="start" fill="#0f172a" font-weight="700">Fail fast</text>
<text x="400" y="117" font-size="20" text-anchor="start" fill="#475569">stage rẻ, nhanh đứng trước stage đắt</text>
