<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="460" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Self-hosted runner: chỉ gọi ra, không ai gọi vào</text>
<rect x="40" y="90" width="400" height="220" rx="12" fill="#ffffff" stroke="#475569" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="60" y="120" font-size="20" text-anchor="start" fill="#475569" font-weight="700">Máy của bạn (không mở cổng)</text>
<rect x="60" y="135" width="190" height="65" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="155" y="175" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">Runner</text>
<rect x="60" y="225" width="190" height="65" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="155" y="265" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">Docker local</text>
<path d="M155 202L155 222" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="660" y="110" width="260" height="150" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="790" y="179" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">GitHub Actions</text>
<text x="790" y="211" font-size="20" text-anchor="middle" fill="#475569">giao job cho runner</text>
<path d="M252 167L656 167" stroke="#1d63ed" stroke-width="3" marker-end="url(#a)"/>
<text x="552" y="152" font-size="20" text-anchor="middle" fill="#1d63ed" font-weight="700">HTTPS: runner gọi ra</text>
<path d="M656 230L444 230" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#a)"/>
<text x="552" y="258" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="700">✗ không kết nối vào</text>
<rect x="40" y="330" width="280" height="42" rx="21" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="180" y="358" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">Chỉ repo private</text>
<rect x="340" y="330" width="280" height="42" rx="21" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="480" y="358" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">User thường, không root</text>
<rect x="640" y="330" width="280" height="42" rx="21" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="780" y="358" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">Bật khi cần deploy</text>
<rect x="40" y="390" width="880" height="50" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="480" y="422" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="700">Repo public: không dùng, người lạ mở PR là chạy code trên máy bạn</text>

</svg>
