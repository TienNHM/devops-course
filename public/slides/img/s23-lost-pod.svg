<text x="60" y="329" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">$ kubectl get pods</text>
<text x="60" y="359" font-size="20" fill="#f87171" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">No resources found in default namespace.</text>
<text x="60" y="389" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">$ kubectl get pods -n club     # thấy Pod</text>

