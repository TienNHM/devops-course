<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Runner là máy trống cho đến khi có checkout</text>
<rect x="40" y="85" width="420" height="40" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="250" y="112" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="700">Không có actions/checkout</text>
<rect x="40" y="135" width="420" height="150" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="60" y="171" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ ls</text>
<text x="60" y="201" font-size="20" text-anchor="start" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">(không có gì)</text>
<rect x="500" y="85" width="420" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="710" y="112" font-size="20" text-anchor="middle" fill="#16a34a" font-weight="700">Có actions/checkout@v4</text>
<rect x="500" y="135" width="420" height="150" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
