<rect x="500" y="315" width="420" height="70" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="710" y="344" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">uses:</text>
