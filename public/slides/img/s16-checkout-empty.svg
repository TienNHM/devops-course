<text x="520" y="201" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">lab-16  ...</text>
<text x="520" y="231" font-size="20" text-anchor="start" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">(file của repo)</text>
<rect x="40" y="315" width="420" height="70" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="250" y="344" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">run:</text>
