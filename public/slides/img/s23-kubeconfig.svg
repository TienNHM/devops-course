<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">kubeconfig: context = cluster + user + namespace</text>
<rect x="40" y="90" width="310" height="310" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="60" y="124" font-size="22" font-weight="700" text-anchor="start" fill="#475569" font-family="Consolas, 'Courier New', monospace">~/.kube/config</text>
<rect x="60" y="145" width="270" height="66" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="195" y="172" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">clusters</text>
<text x="195" y="200" font-size="20" text-anchor="middle" fill="#475569">địa chỉ API + CA</text>
<rect x="60" y="225" width="270" height="66" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="195" y="252" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">users</text>
<text x="195" y="280" font-size="20" text-anchor="middle" fill="#475569">chứng chỉ, token</text>
<rect x="60" y="305" width="270" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="195" y="334" font-size="22" font-weight="700" text-anchor="middle" fill="#16a34a">contexts</text>
<text x="195" y="362" font-size="20" text-anchor="middle" fill="#475569">ghép cả ba</text>
<path d="M352 340L416 190" stroke="#16a34a" stroke-width="3" marker-end="url(#a)"/>
<rect x="420" y="90" width="500" height="160" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="440" y="126" font-size="24" font-weight="700" text-anchor="start" fill="#16a34a">current-context: kind-club</text>
<rect x="440" y="150" width="140" height="62" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="510" y="189" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">cluster</text>
<text x="595" y="190" font-size="28" font-weight="700" text-anchor="middle" fill="#475569">+</text>
<rect x="610" y="150" width="130" height="62" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="675" y="189" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">user</text>
<text x="756" y="190" font-size="28" font-weight="700" text-anchor="middle" fill="#475569">+</text>
<rect x="770" y="150" width="135" height="62" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
<text x="837" y="189" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">namespace</text>
<rect x="420" y="285" width="500" height="115" rx="12" fill="#0f172a"/>
<text x="440" y="319" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">$ kubectl config current-context</text>
<text x="440" y="349" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">kind-club</text>
<text x="440" y="379" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">$ kubectl config get-contexts</text>

