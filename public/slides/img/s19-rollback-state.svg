<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">File trạng thái: current-tag và previous-tag</text>
<rect x="40" y="90" width="280" height="44" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="180" y="119" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">Deploy bản 1</text>
<rect x="40" y="150" width="280" height="110" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="60" y="186" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">current  sha-abc1234</text>
<text x="60" y="216" font-size="20" text-anchor="start" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace">previous (trống)</text>
<rect x="340" y="90" width="280" height="44" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="480" y="119" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">Deploy bản 2</text>
<rect x="340" y="150" width="280" height="110" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="360" y="186" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">current  sha-def5678</text>
<text x="360" y="216" font-size="20" text-anchor="start" fill="#fbbf24" font-family="Consolas, 'Courier New', monospace">previous sha-abc1234</text>
<rect x="640" y="90" width="280" height="44" rx="22" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="780" y="119" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">ROLLBACK=1</text>
<rect x="640" y="150" width="280" height="110" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="660" y="186" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">current  sha-abc1234</text>
<text x="660" y="216" font-size="20" text-anchor="start" fill="#fbbf24" font-family="Consolas, 'Courier New', monospace">previous sha-def5678</text>
<path d="M322 205L338 205" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M622 205L638 205" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="295" width="880" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="480" y="337" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">Rollback chỉ là deploy lại tag cũ, qua cùng một cơ chế</text>
<text x="480" y="374" font-size="20" text-anchor="middle" fill="#475569">Rollback lần hai hoán đổi lại hai bản, không lùi thêm một bước</text>

