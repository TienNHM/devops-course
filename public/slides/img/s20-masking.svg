<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Che secret trong log chỉ khớp theo chuỗi</text>
<rect x="40" y="90" width="560" height="220" rx="12" fill="#0f172a" stroke="#0f172a" stroke-width="1"/>
<text x="60" y="126" font-size="20" text-anchor="start" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace"># secret giả: my-secret-123</text>
<text x="60" y="156" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ echo "$MY_SECRET"</text>
<text x="60" y="186" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">***</text>
<text x="60" y="216" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ echo "$MY_SECRET" | base64</text>
<text x="60" y="246" font-size="20" text-anchor="start" fill="#f87171" font-family="Consolas, 'Courier New', monospace">bXktc2VjcmV0LTEyMw==</text>
<rect x="630" y="90" width="290" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="775" y="129" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Giá trị thô</text>
<text x="775" y="161" font-size="20" text-anchor="middle" fill="#475569">bị che thành ***</text>
<rect x="630" y="215" width="290" height="95" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="775" y="256" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="700">Giá trị bị biến đổi</text>
<text x="775" y="288" font-size="20" text-anchor="middle" fill="#475569">lộ chuỗi thật</text>
<rect x="40" y="335" width="880" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="480" y="366" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">Che log không thay việc không in secret</text>
<text x="480" y="392" font-size="18" text-anchor="middle" fill="#475569">Demo dùng secret giả, rồi xoay sau buổi</text>

</svg>
