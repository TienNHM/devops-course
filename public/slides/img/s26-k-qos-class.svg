<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="260" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">QoS suy ra từ requests và limits</text>
<rect x="40" y="76" width="280" height="100" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="180" y="122" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Guaranteed</text>
<text x="180" y="152" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">requests = limits</text>
<text x="180" y="210" font-size="20" font-weight="400" text-anchor="middle" fill="#475569">bị loại sau cùng</text>
<rect x="340" y="76" width="280" height="100" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="480" y="122" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">Burstable</text>
<text x="480" y="152" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">requests &lt; limits</text>
<text x="480" y="210" font-size="20" font-weight="700" text-anchor="middle" fill="#0f172a">club-api ở đây</text>
<rect x="640" y="76" width="280" height="100" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="780" y="122" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">BestEffort</text>
<text x="780" y="152" font-size="19" font-weight="400" text-anchor="middle" fill="#475569">không khai báo</text>
<text x="780" y="210" font-size="20" font-weight="400" text-anchor="middle" fill="#475569">bị loại đầu tiên</text>

</svg>
