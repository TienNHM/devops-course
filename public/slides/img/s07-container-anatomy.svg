<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Container là process Linux, được cô lập bằng 3 thứ</text>
<rect x="40" y="95" width="420" height="120" rx="14" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="60" y="135" font-size="24" text-anchor="start" fill="#1d63ed" font-weight="700">Namespaces</text>
<text x="60" y="168" font-size="20" text-anchor="start" fill="#475569">mỗi container thấy PID, mạng,</text>
<text x="60" y="195" font-size="20" text-anchor="start" fill="#475569">mount, hostname riêng</text>
<rect x="40" y="235" width="420" height="120" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="60" y="275" font-size="24" text-anchor="start" fill="#d97706" font-weight="700">cgroups</text>
<text x="60" y="308" font-size="20" text-anchor="start" fill="#475569">giới hạn và đo CPU, RAM</text>
<text x="60" y="335" font-size="20" text-anchor="start" fill="#475569">của từng container</text>
<text x="710" y="118" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700">Union filesystem</text>
<rect x="500" y="135" width="420" height="50" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="710" y="168" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Lớp ghi mỏng của container</text>
<rect x="500" y="190" width="420" height="46" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="710" y="221" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">layer: mã nguồn app</text>
<rect x="500" y="241" width="420" height="46" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="710" y="272" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">layer: thư viện</text>
<rect x="500" y="292" width="420" height="46" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="710" y="323" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">layer: Alpine + runtime</text>
<text x="710" y="365" font-size="20" text-anchor="middle" fill="#475569">layer của image: chỉ đọc</text>
<text x="480" y="400" font-size="22" text-anchor="middle" fill="#0f172a">Không phải &quot;máy ảo nhỏ&quot;: chỉ là process thường trên kernel host.</text>

</svg>
