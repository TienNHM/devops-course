  </defs>
  <rect width="960" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>

  <rect x="30" y="30" width="420" height="360" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
