  <text x="50" y="100" font-size="19" fill="#0f172a">docker build -t club-api:day6 .</text>
  <rect x="50" y="120" width="380" height="150" rx="10" fill="#ffffff" stroke="#dc2626" stroke-dasharray="6 4"/>
