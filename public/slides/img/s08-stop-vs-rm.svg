<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 415" width="960" height="415" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs>
<rect width="960" height="415" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">stop giữ container lại, rm mới xóa hẳn</text>
<rect x="40" y="95" width="170" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="125" y="143" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Running</text>
<rect x="340" y="95" width="200" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="440" y="129" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">chờ tối đa</text>
<text x="440" y="161" font-size="20" text-anchor="middle" fill="#475569">10 giây</text>
<rect x="700" y="95" width="220" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="810" y="129" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">Exited</text>
<text x="810" y="161" font-size="20" text-anchor="middle" fill="#475569">còn trên đĩa</text>
<path d="M212 135L336 135" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="274" y="120" font-size="18" text-anchor="middle" fill="#0f172a">SIGTERM</text>
<path d="M542 135L696 135" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<text x="619" y="118" font-size="18" text-anchor="middle" fill="#0f172a">hết giờ: SIGKILL</text>
<rect x="40" y="235" width="280" height="110" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="180" y="284" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, 'Courier New', monospace">docker stop</text>
<text x="180" y="316" font-size="20" text-anchor="middle" fill="#475569">dừng, giữ lại container</text>
<rect x="340" y="235" width="280" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="480" y="284" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="700" font-family="Consolas, 'Courier New', monospace">docker rm</text>
<text x="480" y="316" font-size="20" text-anchor="middle" fill="#475569">xóa container đã dừng</text>
<rect x="640" y="235" width="280" height="110" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="780" y="284" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, 'Courier New', monospace">rm -f  ·  --rm</text>
<text x="780" y="316" font-size="20" text-anchor="middle" fill="#475569">dừng+xóa · tự xóa</text>
<text x="480" y="385" font-size="22" text-anchor="middle" fill="#0f172a">docker ps -a vẫn thấy container đã stop; chỉ rm mới xóa hẳn.</text>

