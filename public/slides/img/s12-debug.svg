<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Có volume nhưng vẫn mất dữ liệu</text>
<rect x="40" y="90" width="880" height="190" rx="12" fill="#0f172a"/>
<text x="62" y="128" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker inspect pg-lab2 (Mounts)</text>
<text x="62" y="160" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">volume pg-data -&gt; /var/lib/postgresql/data</text>
<text x="62" y="192" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ psql -c "SHOW data_directory;"</text>
<text x="62" y="224" font-size="20" text-anchor="start" fill="#f87171" font-family="Consolas, 'Courier New', monospace">/var/lib/postgresql/pgdata</text>
<text x="62" y="256" font-size="20" text-anchor="start" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace"># ví dụ khi PGDATA bị đổi</text>
<rect x="40" y="310" width="260" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="170" y="349" font-size="20" text-anchor="middle" fill="#dc2626" font-weight="700">Hai đường dẫn lệch</text>
<text x="170" y="381" font-size="20" text-anchor="middle" fill="#475569">volume không được dùng</text>
<path d="M302 355L356 355" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="360" y="310" width="280" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="500" y="349" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">docker diff</text>
<text x="500" y="381" font-size="20" text-anchor="middle" fill="#475569">dữ liệu ở writable layer</text>
<path d="M642 355L676 355" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<rect x="680" y="310" width="240" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="800" y="349" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Sửa: cho khớp</text>
<text x="800" y="381" font-size="20" text-anchor="middle" fill="#475569">bỏ PGDATA hoặc khớp</text>

</svg>
