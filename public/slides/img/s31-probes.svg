<rect x="490" y="90" width="430" height="290" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="705" y="130" font-size="24" text-anchor="middle" fill="#16a34a" font-weight="700">Liveness: /health</text>
<text x="705" y="180" font-size="22" text-anchor="middle" fill="#0f172a">chỉ báo tiến trình sống</text>
