<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="250" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0f172a">Stage nối stage, fail thì dừng</text>
