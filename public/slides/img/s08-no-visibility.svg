<rect width="960" height="410" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Chạy rồi mà không thấy gì?</text>
<rect x="40" y="95" width="430" height="275" rx="12" fill="#0f172a"/>
<text x="62" y="133" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker run -d postgres</text>
<text x="62" y="163" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">3f9c1e7a2b40...</text>
<text x="62" y="193" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker ps</text>
<text x="62" y="223" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">CONTAINER ID  IMAGE  STATUS</text>
