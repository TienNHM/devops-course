<text x="150" y="172" font-size="18" text-anchor="middle" fill="#1d63ed" font-weight="700">net-a</text>
<rect x="75" y="185" width="150" height="52" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="150" y="219" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">iso-a</text>
<rect x="270" y="150" width="180" height="100" rx="14" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="360" y="172" font-size="18" text-anchor="middle" fill="#d97706" font-weight="700">net-b</text>
<rect x="285" y="185" width="150" height="52" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="360" y="219" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">iso-b</text>
<path d="M283 262L220 262" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#r)"/>
<text x="255" y="296" font-size="28" text-anchor="middle" fill="#dc2626" font-weight="700">✗</text>
<text x="255" y="334" font-size="19" text-anchor="middle" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">wget iso-a → bad address</text>
<text x="255" y="366" font-size="19" text-anchor="middle" fill="#dc2626" font-family="Consolas, 'Courier New', monospace">wget IP → download timed out</text>
<rect x="490" y="90" width="430" height="310" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
<text x="705" y="126" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Sau khi connect</text>
<rect x="510" y="150" width="390" height="100" rx="14" fill="#eff6ff" stroke="#1d63ed" stroke-width="2.5" stroke-dasharray="10 6"/>
<text x="530" y="174" font-size="18" text-anchor="start" fill="#1d63ed" font-weight="700">net-a</text>
<rect x="530" y="184" width="150" height="52" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="605" y="218" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">iso-a</text>
<rect x="720" y="184" width="160" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="800" y="218" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">iso-b ✓</text>
<path d="M718 210L682 210" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
<text x="705" y="296" font-size="19" text-anchor="middle" fill="#0f172a" font-family="Consolas, 'Courier New', monospace">docker network connect net-a iso-b</text>
<text x="705" y="334" font-size="19" text-anchor="middle" fill="#16a34a" font-weight="700" font-family="Consolas, 'Courier New', monospace">wget iso-a → HTML của Nginx</text>
<text x="705" y="366" font-size="18" text-anchor="middle" fill="#475569">Một container có thể ở nhiều network</text>

