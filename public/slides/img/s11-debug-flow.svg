<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker></defs>
<rect width="960" height="430" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Điều tra theo thứ tự: log, env, nslookup</text>
<rect x="40" y="90" width="190" height="190" rx="14" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="135" y="124" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">① docker logs</text>
<text x="135" y="170" font-size="19" text-anchor="middle" fill="#dc2626" font-weight="700" font-family="Consolas, 'Courier New', monospace">ECONNREFUSED</text>
<text x="135" y="204" font-size="19" text-anchor="middle" fill="#dc2626" font-family="Consolas, 'Courier New', monospace">127.0.0.1:5432</text>
<text x="135" y="250" font-size="18" text-anchor="middle" fill="#475569">loopback của API</text>
<rect x="270" y="90" width="190" height="190" rx="14" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="365" y="124" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, 'Courier New', monospace">② env | grep DB_</text>
<text x="365" y="170" font-size="19" text-anchor="middle" fill="#475569" font-family="Consolas, 'Courier New', monospace">DB_HOST=</text>
<text x="365" y="204" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="700" font-family="Consolas, 'Courier New', monospace">localhost</text>
<text x="365" y="250" font-size="18" text-anchor="middle" fill="#475569">sai giá trị</text>
<rect x="500" y="90" width="190" height="190" rx="14" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="595" y="124" font-size="20" text-anchor="middle" fill="#0f172a" font-weight="700">③ nslookup</text>
<text x="595" y="170" font-size="19" text-anchor="middle" fill="#475569" font-family="Consolas, 'Courier New', monospace">lab-postgres</text>
<text x="595" y="204" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">→ có IP ✓</text>
<text x="595" y="250" font-size="18" text-anchor="middle" fill="#475569">network ổn</text>
<rect x="730" y="90" width="190" height="190" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="825" y="124" font-size="20" text-anchor="middle" fill="#16a34a" font-weight="700">④ Kết luận</text>
<text x="825" y="170" font-size="20" text-anchor="middle" fill="#0f172a">lỗi cấu hình,</text>
<text x="825" y="204" font-size="20" text-anchor="middle" fill="#0f172a">không phải mạng</text>
<text x="825" y="250" font-size="20" text-anchor="middle" fill="#16a34a" font-weight="700">sửa DB_HOST</text>
<path d="M232 185L266 185" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M462 185L496 185" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M692 185L726 185" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="310" width="880" height="100" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="480" y="348" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">localhost trong container = chính container API</text>
<text x="480" y="386" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Sửa: tạo lại API với DB_HOST=lab-postgres</text>

</svg>
