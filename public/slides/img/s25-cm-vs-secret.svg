<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="460" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">ConfigMap và Secret khác nhau ở đâu</text>
<rect x="230" y="82" width="330" height="50" rx="12" fill="#dbeafe" stroke="#1d63ed" stroke-width="2.5"/>
<text x="395" y="116" font-size="24" font-weight="700" text-anchor="middle" fill="#1d63ed">ConfigMap</text>
<rect x="590" y="82" width="330" height="50" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="755" y="116" font-size="24" font-weight="700" text-anchor="middle" fill="#d97706">Secret</text>
<text x="40" y="184" font-size="20" font-weight="700" text-anchor="start" fill="#475569">Dùng cho</text>
<rect x="230" y="148" width="330" height="56" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="395" y="184" font-size="20" text-anchor="middle" fill="#0f172a">cấu hình thường</text>
<rect x="590" y="148" width="330" height="56" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="755" y="184" font-size="20" text-anchor="middle" fill="#0f172a">mật khẩu, token</text>
<text x="40" y="250" font-size="20" font-weight="700" text-anchor="start" fill="#475569">describe</text>
<rect x="230" y="214" width="330" height="56" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="395" y="250" font-size="20" text-anchor="middle" fill="#0f172a">hiện giá trị</text>
<rect x="590" y="214" width="330" height="56" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="755" y="250" font-size="20" text-anchor="middle" fill="#0f172a">chỉ hiện tên key và số byte</text>
<text x="40" y="316" font-size="20" font-weight="700" text-anchor="start" fill="#475569">Trong etcd</text>
<rect x="230" y="280" width="330" height="56" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="395" y="316" font-size="20" text-anchor="middle" fill="#0f172a">không mã hóa</text>
<rect x="590" y="280" width="330" height="56" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="755" y="316" font-size="20" text-anchor="middle" fill="#0f172a">mặc định không mã hóa</text>
<text x="40" y="382" font-size="20" font-weight="700" text-anchor="start" fill="#475569">Mount volume</text>
<rect x="230" y="346" width="330" height="56" rx="12" fill="#ffffff" stroke="#1d63ed" stroke-width="2.5"/>
<text x="395" y="382" font-size="20" text-anchor="middle" fill="#0f172a">đĩa của node</text>
<rect x="590" y="346" width="330" height="56" rx="12" fill="#ffffff" stroke="#d97706" stroke-width="2.5"/>
<text x="755" y="382" font-size="20" text-anchor="middle" fill="#0f172a">tmpfs (RAM)</text>
<text x="480" y="435" font-size="20" text-anchor="middle" fill="#475569">Cả hai tối đa 1 MiB; Secret mặc định chưa được mã hóa trong etcd.</text>

