<text x="365" y="124" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">PID 1 chạy</text>
<text x="365" y="156" font-size="20" text-anchor="middle" fill="#475569">postgres</text>
<rect x="500" y="90" width="190" height="80" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="595" y="124" font-size="22" text-anchor="middle" fill="#dc2626" font-weight="700">Thiếu mật khẩu</text>
<text x="595" y="156" font-size="20" text-anchor="middle" fill="#475569">chưa đặt biến -e</text>
