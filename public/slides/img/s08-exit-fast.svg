<path d="M232 130L266 130" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M462 130L496 130" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<path d="M692 130L726 130" stroke="#475569" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="200" width="880" height="225" rx="12" fill="#0f172a"/>
<text x="62" y="238" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker ps -a --filter name=demo-pg</text>
<text x="62" y="268" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">demo-pg  postgres:17-alpine  Exited (1)</text>
<text x="62" y="298" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker logs demo-pg</text>
<text x="62" y="328" font-size="20" text-anchor="start" fill="#f87171" font-family="Consolas, 'Courier New', monospace">Error: Database is uninitialized and superuser</text>
<text x="62" y="358" font-size="20" text-anchor="start" fill="#f87171" font-family="Consolas, 'Courier New', monospace">       password is not specified.</text>
<text x="62" y="388" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker rm demo-pg   # chạy lại, thêm -e POSTGRES_PASSWORD</text>

