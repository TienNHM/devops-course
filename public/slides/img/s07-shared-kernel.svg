<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16a34a"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#dc2626"/></marker>
<marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97706"/></marker></defs>
<rect width="960" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Alpine và host dùng chung một kernel</text>
<rect x="40" y="90" width="880" height="190" rx="12" fill="#0f172a"/>
<text x="62" y="128" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ uname -r</text>
<text x="62" y="158" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">6.x.x-microsoft-standard-WSL2</text>
<text x="62" y="188" font-size="20" text-anchor="start" fill="#4ade80" font-family="Consolas, 'Courier New', monospace">$ docker run --rm alpine:3.20 uname -r</text>
<text x="62" y="218" font-size="20" text-anchor="start" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace">6.x.x-microsoft-standard-WSL2</text>
<text x="62" y="248" font-size="20" text-anchor="start" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace"># Hai dòng giống nhau</text>
<rect x="40" y="305" width="430" height="85" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="255" y="341" font-size="22" text-anchor="middle" fill="#16a34a" font-weight="700">Image chỉ chứa user space</text>
<text x="255" y="373" font-size="20" text-anchor="middle" fill="#475569">thư viện, công cụ, cấu hình</text>
<rect x="490" y="305" width="430" height="85" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
<text x="705" y="341" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">Không có kernel riêng</text>
<text x="705" y="373" font-size="20" text-anchor="middle" fill="#475569">nên khởi động rất nhanh</text>

