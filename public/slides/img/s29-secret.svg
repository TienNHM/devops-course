<text x="290" y="329" font-size="22" font-weight="700" text-anchor="middle" fill="#dc2626">C1 vẫn chứa mật khẩu</text>
<text x="290" y="361" font-size="20" text-anchor="middle" fill="#475569">ai clone cũng lấy được</text>
