<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 455" width="960" height="455" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="455" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Base64 chỉ là encoding, không phải bảo mật</text>
<rect x="40" y="90" width="880" height="205" rx="12" fill="#0f172a"/>
<text x="60" y="124" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">$ kubectl describe secret club-secrets -n club</text>
<text x="60" y="160" font-size="20" fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">db-password:  N bytes</text>
<text x="60" y="196" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">$ kubectl get secret club-secrets -n club \</text>
<text x="60" y="232" font-size="20" fill="#4ade80" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">    -o jsonpath='{.data.db-password}' | base64 -d</text>
<text x="60" y="268" font-size="20" fill="#f87171" font-family="Consolas, 'Courier New', monospace" xml:space="preserve">&lt;mật khẩu thật hiện ra&gt;</text>
<rect x="40" y="320" width="430" height="64" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="255" y="360" font-size="21" font-weight="700" text-anchor="middle" fill="#0f172a">describe: giá trị bị ẩn</text>
<rect x="490" y="320" width="430" height="64" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="705" y="360" font-size="21" font-weight="700" text-anchor="middle" fill="#dc2626">get + base64 -d: lộ hết</text>
<text x="480" y="430" font-size="20" text-anchor="middle" fill="#475569">Ai get secret được thì đọc được: RBAC chặt, không commit Secret thật.</text>

</svg>
