<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="960" height="420" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="40" y="58" font-size="30" font-weight="700" fill="#0f172a">Mã trạng thái là một phần hợp đồng API</text>
<rect x="40" y="90" width="400" height="280" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
<text x="240" y="130" font-size="24" text-anchor="middle" fill="#16a34a" font-weight="700">Thành công</text>
<text x="240" y="182" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">GET → 200</text>
<text x="240" y="232" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">POST → 201</text>
<text x="240" y="282" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">PUT → 200</text>
<text x="240" y="332" font-size="24" text-anchor="middle" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">DELETE → 204</text>
<rect x="480" y="90" width="440" height="280" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
<text x="700" y="130" font-size="24" text-anchor="middle" fill="#dc2626" font-weight="700">Lỗi có chủ đích</text>
<text x="700" y="182" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">400 dữ liệu / id sai</text>
<text x="700" y="232" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">404 không tìm thấy</text>
<text x="700" y="282" font-size="22" text-anchor="middle" fill="#0f172a" font-weight="700">409 trùng email</text>
<text x="700" y="332" font-size="20" text-anchor="middle" fill="#475569">mã 23505 → 409, không 500</text>

</svg>
