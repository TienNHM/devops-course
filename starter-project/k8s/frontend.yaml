apiVersion: apps/v1
kind: Deployment
metadata:
  name: club-web
  namespace: club
spec:
  replicas: 1
  selector:
    matchLabels:
      app: club-web
  template:
    metadata:
      labels:
        app: club-web
    spec:
      containers:
        - name: web
          # docker build -t club-web:1.0.0 ./frontend && kind load docker-image club-web:1.0.0
          image: club-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: club-web
  namespace: club
spec:
  selector:
    app: club-web
  ports:
    - port: 80
      targetPort: 80
