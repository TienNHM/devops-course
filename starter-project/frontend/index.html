<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Management</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
    #status { color: #666; }
  </style>
</head>
<body>
  <h1>Club Members</h1>
  <p id="status">Loading...</p>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Email</th></tr></thead>
    <tbody id="members"></tbody>
  </table>
  <script>
    const tbody = document.getElementById("members");
    const status = document.getElementById("status");
    fetch("/api/members")
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then((members) => {
        status.textContent = `${members.length} member(s)`;
        for (const m of members) {
          const tr = document.createElement("tr");
          for (const value of [m.id, m.name, m.email]) {
            const td = document.createElement("td");
            td.textContent = value;
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        }
      })
      .catch((err) => { status.textContent = `Cannot load members: ${err.message}`; });
  </script>
</body>
</html>
