# Yêu cầu ConfigMap postgres-init tạo trước từ database/init.sql:
#   kubectl create configmap postgres-init -n club --from-file=init.sql=database/init.sql
# Script trong /docker-entrypoint-initdb.d chỉ chạy khi PVC còn trống (lần khởi tạo đầu tiên).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: club
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: club
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: clubdb
            - name: POSTGRES_USER
              value: club
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: club-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "club", "-d", "clubdb"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "club", "-d", "clubdb"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: club
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
