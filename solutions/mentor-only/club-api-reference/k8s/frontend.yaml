apiVersion: apps/v1
kind: Deployment
metadata:
  name: club-web
  namespace: club
spec:
  replicas: 1
  selector:
    matchLabels:
      app: club-web
  template:
    metadata:
      labels:
        app: club-web
    spec:
      containers:
        - name: web
          # kind: docker build -t club-web:1.0.0 ./frontend && kind load docker-image club-web:1.0.0 --name club
          image: club-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          # nginx chạy master process bằng root rồi hạ quyền worker, nên giữ lại 4 capability tối thiểu.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: club-web
  namespace: club
spec:
  selector:
    app: club-web
  ports:
    - port: 80
      targetPort: 80
