# Đặt file này vào .github/workflows/security.yml trong repo nhóm.
# Lưu ý: nên ghim action theo commit SHA đã kiểm tra, và xác nhận phiên bản trên trang releases
# của aquasecurity/trivy-action trước khi dùng.
name: Security scan

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  trivy-fs:
    name: Scan repository (dependencies, secrets, misconfiguration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  trivy-image:
    name: Scan image ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: club-api
            context: backend
          - name: club-web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: ${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
