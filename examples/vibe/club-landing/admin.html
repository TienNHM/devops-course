<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Quản trị - Danh sách thành viên</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">DSC<span>.club</span></a>
      <nav class="menu"><a href="index.html">Về trang chủ</a></nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1 class="h1-small">Quản trị thành viên</h1>

      <div id="setupNotice" class="alert alert-warn" hidden>
        Chưa cấu hình Supabase. Tạo file <code>config.js</code> từ <code>config.example.js</code>.
      </div>

      <section id="loginPanel" class="form-wrap" hidden>
        <p class="narrow">Đăng nhập bằng tài khoản admin đã tạo trong Supabase Authentication.</p>
        <form id="loginForm">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" autocomplete="username" required>
          <label for="loginPassword">Mật khẩu</label>
          <input id="loginPassword" type="password" autocomplete="current-password" required>
          <button class="btn" type="submit">Đăng nhập</button>
        </form>
      </section>

      <section id="listPanel" hidden>
        <div class="toolbar">
          <span id="whoami"></span>
          <span class="spacer"></span>
          <button id="csvBtn" class="btn btn-ghost btn-small" type="button">Tải CSV</button>
          <button id="logoutBtn" class="btn btn-small" type="button">Đăng xuất</button>
        </div>
        <p id="count" class="note"></p>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Thời gian</th><th>Họ tên</th><th>Email</th><th>MSSV</th><th>Quan tâm</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>

      <p id="adminMsg" class="alert" role="status" aria-live="polite" hidden></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
</body>
</html>
