apiVersion: v1
kind: Namespace
metadata:
  name: ts-07
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: club-api
  namespace: ts-07
spec:
  replicas: 1
  selector:
    matchLabels:
      app: club-api
  template:
    metadata:
      labels:
        app: club-api
    spec:
      containers:
        - name: api
          image: club-api:1.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
