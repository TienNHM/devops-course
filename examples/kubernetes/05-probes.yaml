# 05-probes.yaml - Readiness, liveness và startup probe trên Nginx.
# Buổi liên quan: Tuần 15. Liên quan tình huống lỗi "readiness probe fail".
# Thử nghiệm: đổi readinessProbe.httpGet.path thành /khong-co rồi apply lại,
# Pod sẽ ở trạng thái 0/1 READY và bị loại khỏi Endpoints của Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  namespace: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe-demo
  template:
    metadata:
      labels:
        app: probe-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: probe-demo
  namespace: demo
spec:
  selector:
    app: probe-demo
  ports:
    - port: 80
      targetPort: 80
