# 04-configmap-secret.yaml - ConfigMap (cấu hình không nhạy cảm), Secret (nhạy cảm) và Pod đọc cả hai qua biến môi trường.
# Buổi liên quan: Tuần 14-15.
# CẢNH BÁO: giá trị trong stringData dưới đây chỉ để minh họa. KHÔNG commit giá trị thật vào Git.
# Secret chỉ được mã hóa base64 (không phải mã hóa bảo mật), ai đọc được manifest là đọc được giá trị.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: demo
data:
  APP_ENV: "learning"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: demo
type: Opaque
stringData:
  DB_PASSWORD: "gia-tri-minh-hoa-khong-dung-that"
---
apiVersion: v1
kind: Pod
metadata:
  name: config-demo
  namespace: demo
spec:
  restartPolicy: Never
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sh", "-c", "env | grep -E 'APP_ENV|LOG_LEVEL|DB_PASSWORD' | sort; sleep 3600"]
      envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secret
