# kind-3-nodes.yaml - Cluster kind 1 control-plane + 2 worker, map cổng 80/443 để dùng Ingress.
# Tạo: kind create cluster --name demo --config kind-3-nodes.yaml
# Lưu ý: cần cổng 80 và 443 trên máy host đang trống.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
